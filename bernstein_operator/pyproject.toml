[project]
name = "bernstein-operator"
version = "0.1.0"
description = "Content-bound scorer gate for Bernstein phase runs"
requires-python = ">=3.13"
dependencies = ["bernstein", "pyyaml", "psutil>=6"]

[dependency-groups]
dev = [
    "ruff>=0.16.6",          # 0.16 is the rule set this config is written against
    "ty==0.0.79",            # beta: pin tight, inference changes between minors
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv.sources]
bernstein = { git = "https://github.com/sipyourdrink-ltd/bernstein", rev = "0a6bf9f2d69daae4ad468a9ba6a2713f79d67fdf" }

[project.entry-points."bernstein.gates"]
scorer = "bernstein_operator.scorer:ScorerGate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bernstein_operator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = ["--strict-markers", "--strict-config", "-ra"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# No `select`: ruff 0.16 enables 413 rules by default and a select list shrinks that.
ignore = [
    "E501",    # line too long - formatter handles it
    "UP007",   # X | Y unions - Optional[X] is more readable
    "PLW1510", # subprocess returncodes are read by hand here; raising on them loses the evidence
    "BLE001",  # observability boundaries catch broadly on purpose: they never raise on a failure
]
exclude = [".git", ".venv", "__pycache__", "build", "dist"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
exclude = ["*.md"]  # template Markdown must not have its Python fences reformatted

[tool.ty.environment]
python-version = "3.13"
extra-paths = ["../skills/build-run/scripts"]
root = ["src", "../skills/build-run/scripts", "../skills/build-plan/scripts", "../skills/build-close/scripts", "../skills/review-pr/scripts"]
