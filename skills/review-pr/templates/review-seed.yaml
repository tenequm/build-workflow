# /review-pr path A seed: stock bernstein, one role per review lens.
# The goal text arrives via --goal (see SKILL.md); this file never carries it.
# The goal line below is a parser-required placeholder - the orchestrator
# re-parses this file for adapter config and refuses a seed without a goal
# string, while the CLI --goal text is what actually runs.
goal: "Review the pull request per the goal text passed via --goal."
cli: pi
model: litellm/qwen3.8-flash-next:medium
max_agents: 4
budget: $3.00
internal_llm_provider: none

# Bernstein enables a third-party persona catalogue by default
# (CatalogRegistry.default -> github.com/msitarzewski/agency-agents, cloned to
# ~/.bernstein/catalogs/agency) and a catalogue persona OUTRANKS the built-in
# role prompt. Measured here: role `reviewer` was handed a UI design critic and
# role `qa` a GIS data engineer, so every lens prompt rode under an unrelated
# personality that differs per host. An empty list is not None, so the
# orchestrator keeps it instead of falling back to the default registry.
catalogs: []

# ROLE IS A MODEL SLOT, AND EVERY ROLE HERE IS OURS.
#
# Routing is per role, not per task, so a role is the only lever that puts a
# named lens on a named model. The built-in vocabulary cannot express that: it
# has one `analyst` and one `qa`, so two lenses sharing a role must share a
# model. These names are custom on purpose - one per lens, which also makes the
# run legible in the TUI and in the ledger.
#
# Custom names are accepted because the route we use validates against THIS
# mapping and nothing else: core/routes/task_crud.py rejects a role that is not
# a key here with a 400 that names the valid ones. `KNOWN_ROLES` gates the MCP
# `bernstein_create_subtask` tool and the plan-step schema; the manager reaches
# the task server by curl and touches neither.
#
# `manager` is the one name we do not choose. The engine keys behaviour off the
# literal string - the specialists section, the consensus relay and three
# SECTION_RULES entries all test `role == "manager"`.
#
# The built-in role vocabulary must not reach an agent's context, or the manager
# reads it and assigns roles the server will reject. Shipping
# `.bernstein/templates/roles/manager/system_prompt.md` and NO `skills/`
# directory is what closes it: with no skill pack the resolver falls through to
# our legacy template for the manager and to the bare
# "You are a <role> specialist." stub for every lens. See SKILL.md for the copy
# step - the seed cannot do it, because the templates dir is resolved from the
# run's workdir.
role_model_policy:
  manager:                   { cli: codex, model: gpt-5.6-sol }
  lens-1-claim:              { cli: codex, model: gpt-5.6-sol }
  lens-2-side-effects:       { cli: codex, model: gpt-5.6-sol }
  lens-3-design:             { cli: codex, model: gpt-5.6-sol }
  lens-4-efficiency:         { cli: pi,    model: 'litellm/qwen3.8-flash-next:medium' }
  lens-4-efficiency-shadow:  { cli: agy,   model: gemini-3.7-flash-medium }
  lens-5-cleanliness:        { cli: pi,    model: 'litellm/qwen3.8-flash-next:medium' }
  lens-5-cleanliness-shadow: { cli: agy,   model: gemini-3.7-flash-medium }
  report-writer:             { cli: codex, model: gpt-5.6-sol }

# Codex effort is not a flag and not an adapter setting: `codex exec` reads
# `model_reasoning_effort` from ~/.codex/config.toml. This lane assumes `high`
# there; bernstein_herdr/src/bernstein_herdr/ready.py hard-fails a run when it
# is missing.
#
# The two qwen lenses run on the local LiteLLM gateway (~/.pi/agent/models.json):
# $0, no rate limits, prompts never leave the machine. The pi adapter drops
# `effort:` silently; thinking level rides the model id suffix instead (qwen3.8's
# own default is xhigh, which measurably hurts tool-call accuracy and can return
# empty completions - pin medium).
#
# The `-shadow` roles are the experiment riding along: they take task text
# byte-identical to the lens they shadow, so any difference in output is
# attributable to the model alone. Their findings files are named `shadow-*` and
# the goal tells the report writer to ignore them, so they cost nothing in the
# review itself.

# The PR diff and text sit untracked at the repo root; agents work in git
# worktrees cut from the base commit, where untracked files are invisible.
# The invocation adds both names to .git/info/exclude so agent commits skip
# them and merges back stay clean.
worktree_setup:
  copy_files:
    - .bernstein-pr.diff
    - .bernstein-pr.md

# pi prints nothing to a redirected stdout until the turn ends, and bernstein's
# heartbeat advances only when the agent log grows - untuned, a quiet pi turn
# is SIGTERMed at ~120s. These floors keep long review turns alive; the
# harness/skill timeout stays the real backstop.
tuning:
  orchestrator:
    max_agent_runtime_s: 2400
    # A pi agent writes nothing to a redirected stdout until its turn ends, so
    # an agent that is alive and working is indistinguishable from a hung one
    # for as long as that turn runs. The stale-claim reaper defaults to 900s and
    # fails the task under a live agent at that mark; on 2026-09-12 that reaped
    # four healthy managers in a row and quarantined the only task in the run.
    # It is raised to the same floor as the rest, and the engine's own ordering
    # is kept: stale-claim fires first, and still inside the CLI's 3600s wait.
    stale_claim_timeout_s: 2400
    stalled_run_grace_s: 3000
  agent:
    heartbeat_stale_s: 2400
    escalation_sigterm_s: 2400
    escalation_sigkill_s: 2700
    liveness_grace_s: 2400
    liveness_suppression_cap_s: 2700

constraints:
  - "Never commit and never push."
  - "Write exactly one file: review-report.md at the repository root. Modify nothing else."
  - "Read any validation or test command from the base branch only, never from the pull request's own tree."
