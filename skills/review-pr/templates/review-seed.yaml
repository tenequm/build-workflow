# /review-pr path A seed: stock bernstein over subscription-backed CLIs.
# The goal text arrives via --goal (see SKILL.md); this file never carries it.
# The goal line below is a parser-required placeholder - the orchestrator
# re-parses this file for adapter config and refuses a seed without a goal
# string, while the CLI --goal text is what actually runs.
goal: "Review the pull request per the goal text passed via --goal."
cli: agy
model: gemini-3.7-flash-medium
max_agents: 4
budget: $3.00
internal_llm_provider: none

# The manager decomposes the goal and drives the task server over curl, which
# punishes loose tool discipline; the three lens roles are rubric-driven bulk
# reading, which is what flash is for. Both lanes are subscription-backed, so
# a run spends quota, never dollars - `agy` reports its own remaining quota.
role_model_policy:
  manager:  { cli: claude, model: claude-sonnet-5, effort: high }
  reviewer: { cli: agy, model: gemini-3.7-flash-medium, effort: medium }
  security: { cli: agy, model: gemini-3.7-flash-medium, effort: medium }
  qa:       { cli: agy, model: gemini-3.7-flash-medium, effort: medium }

# The PR diff and text sit untracked at the repo root; agents work in git
# worktrees cut from the base commit, where untracked files are invisible.
worktree_setup:
  copy_files:
    - .bernstein-pr.diff
    - .bernstein-pr.md

constraints:
  - "Never commit and never push."
  - "Write exactly one file: review-report.md at the repository root. Modify nothing else."
  - "Read any validation or test command from the base branch only, never from the pull request's own tree."
