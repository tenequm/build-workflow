# The template plan for /review-pr.
#
# The shape is static: stage 0 lints, stage 1 gates, stage 2 reviews through four
# lenses, stage 3 verifies one task per surviving finding, stage 4 synthesises. No
# planning machinery re-derives that per pull request. What DOES change per pull
# request is the routing, and it changes here - swapping a model is one line.
#
# Every stage is a separate driver-owned batch of one-shot ACP sessions. Stage 3 must
# never share a task board with stage 2: the engine releases dependents on
# worker-reported DONE, before verification, so reviewed-then-verified ordering is a
# property of the driver's boundary and nothing else.
version: 1

families:
  claude:
    transport: claude
    adapter_argv: [npx, --yes, '@agentclientprotocol/claude-agent-acp@0.60.0']
    # Without this the Claude harness saves nothing, so pond has nothing to ingest and
    # a finding produced on this family cannot point at the transcript behind it.
    # Codex and agy write their own rollouts and need no equivalent.
    persist_session: true
  codex:
    transport: acp
    adapter_argv: [npx, --yes, '@agentclientprotocol/codex-acp@1.1.5']
  gemini:
    transport: acp
    # A wrapper, not the .par: on Linux the ACP server needs --uid=. Point this at
    # your own wrapper; `review-pr ready` refuses an unresolvable adapter.
    adapter_argv: ['{{HOME}}/.local/bin/agy-acp-server']

# Stage 2. Five lenses declared, three enabled. Four are polish's, aimed at a code
# diff; the fifth is this workflow's own and is the only one allowed to leave the diff.
#
# cleanliness and efficiency are parked (`enabled: false`), not deleted: against the
# ground-truth replay they contributed none of the correctness or design signal and
# most of the nit-tier comments that dilute a review's credibility. Re-admit one with
# one line when the precision ledger shows it earns its place.
#
# The bounds here are ceilings, not targets. They exist so a runaway session ends, not
# to economise: the gating lens previously reported 93% of a $2.50 budget, which means
# the ceiling was shaping the review. Raise one before trimming it.
lenses:
  cleanliness:
    enabled: false
    family: gemini
    model: gemini-3.7-flash-medium
    budget_usd: 10.0
    max_turns: 60
    timeout_s: 1800
  efficiency:
    enabled: false
    family: claude
    model: claude-sonnet-5
    budget_usd: 10.0
    max_turns: 60
    timeout_s: 1800
  design:
    family: codex
    model: gpt-5.6-sol
    effort: high
    budget_usd: 15.0
    max_turns: 120
    timeout_s: 3600
    models:
      codex: gpt-5.6-sol
      claude: claude-opus-5
      gemini: gemini-3.8-flash-high
  gating:
    family: claude
    model: claude-opus-5
    budget_usd: 15.0
    max_turns: 120
    timeout_s: 3600
    models:
      claude: claude-opus-5
      gemini: gemini-3.8-flash-high
    # A correctness rule, not a preference: OpenAI's content filter silently truncates
    # turns on exactly this brief's vocabulary (race, exploit, attack, sweep) and the
    # truncated turn presents as a clean completion.
    forbid_families: [codex]
  # The lens the first ground-truth replay proved missing. Every finding that replay
  # lost had one shape - a claim the diff adds, checked against an implementation the
  # diff does not touch - and no polish lens looks there, because polish reviews code
  # diffs and says so: "the diff is the hunting scope". This one inverts that, so it
  # gets the largest turn budget of any lens: it is doing repository archaeology.
  implementation:
    family: claude
    model: claude-opus-5
    budget_usd: 25.0
    max_turns: 200
    timeout_s: 5400
    models:
      claude: claude-opus-5
      codex: gpt-5.6-sol
      gemini: gemini-3.8-flash-high

# Stage 3 and stage 4.
roles:
  verifier:
    budget_usd: 10.0
    max_turns: 60
    timeout_s: 1800
    models:
      claude: claude-sonnet-5
      codex: gpt-5.6-terra
      gemini: gemini-3.7-flash-medium
  claims:
    family: claude
    model: claude-sonnet-5
    budget_usd: 5.0
    max_turns: 40
    timeout_s: 1200

# Review direction is asymmetric: Claude reviewing Codex 71.6 -> 89.7, Codex reviewing
# Claude 91.4 -> 82.8. When setup detects the author's family, the two lenses that
# reason hardest route to the opposite family. Ambiguous detection changes nothing.
routing:
  opposite:
    claude: codex
    codex: claude
    gemini: claude
  reroute_lenses: [design, gating, implementation]

# Cross-family ensembles realise 43-44% of the theoretical independence gain (same-model
# under 30%), and disagreement alone detects about two thirds of incorrect programs at
# zero false positives. Agreements auto-confirm cheaply; disagreements are where the
# stage-3 budget goes.
dual_family:
  lenses: [design, gating, implementation]
  enabled: true

bounds:
  # Stage 3 is the expensive stage, so the fan-out is capped. Correctness and gating
  # findings take the budget first; past the cap a finding settles on its
  # driver-executed rubric alone. Findings are never batched into one session: a
  # shared verifier would see every other claim and the blinding is the point.
  max_verifier_sessions: 40
  # A suggestion is only attached once it has been applied and gated for real, and
  # each proof is a full run of the pinned command, so the count is bounded. Only
  # correctness suggestions are proven at all - a style suggestion posts as prose.
  max_proven_suggestions: 20
  # No spend bound: these lanes are subscription-backed and cost figures are
  # observability (pond-derived, after the run), never control flow. Runaway
  # protection is per-session - maxBudgetUsd on the Claude bridge, timeout_s and
  # max_turns everywhere - plus this wall clock.
  max_wall_s: 10800
  # A task whose report is missing or unwitnessed is retried once, then parks.
  attempts_per_task: 2

sandbox:
  # container needs a pinned image that can run this repo's gate; userns needs
  # unprivileged user namespaces. Readiness resolves this before any run.
  tier: userns
  image: null
