# TRIAL template: every lens on an OpenCode Zen free model.
#
# POLICY FENCE, operator decision 2026-09-11: free Zen models train on prompts. This
# stages file is permitted ONLY for open-source repositories. /review-pr feeds a model
# the pull request's diff and the repository around it, so pointing this template at a
# private or embargoed tree ships someone else's unreleased code into a training corpus.
# There is no per-request opt-out on the free tier. Open source only.
#
# Same pipeline, same stages, same briefs as stages.yaml; only the routing differs, as
# in stages-fast.yaml. What this template buys is a lane with no credential at all:
# Zen's free tier is served unauthenticated, so it is the only routing under which "no
# model session ever holds a token" is literally true rather than merely enforced.
#
# A number produced here is comparable only with other numbers produced here.
version: 1

families:
  # Verifier only - no lens routes here. verify.opposite() refuses to verify an
  # opencode finding with opencode, and a template with one family parks every finding
  # it produces. gemini is the opposite family because it costs no real money.
  gemini:
    transport: acp
    # A wrapper, not the .par: on Linux the ACP server needs --uid=. Point this at
    # your own wrapper; `review-pr ready` refuses an unresolvable adapter.
    adapter_argv: ['{{HOME}}/.local/bin/agy-acp-server']
  opencode:
    transport: acp
    adapter_argv: [npx, --yes, 'opencode-ai@1.18.30', acp, --pure]
    # opencode's ACP config option is `effort`, not Codex's `reasoning_effort`; it
    # answers the wrong id with -32602 and then runs the lens at its default, `minimal`.
    effort_option: effort
    # opencode writes every session it has ever run into one SQLite store under
    # XDG_DATA_HOME, and --pure still loads the operator's ~/.claude skills. Redirected
    # per session, both stop being true: the reviewer gets an empty configuration, and
    # capture gets a store holding this run's session and nothing else.
    env: [XDG_DATA_HOME, XDG_CONFIG_HOME]

# The same three lenses production enables, so a trial score and a milestone score
# measure the same review. cleanliness and efficiency stay parked here for the reason
# they are parked there: against the ground-truth replay they produced nit-tier noise
# and none of the correctness or design signal.
#
# Every lens states `effort: high`, parked ones included: opencode defaults a session to
# `minimal`, which is the mediocre-but-free failure this trial exists to rule out, and a
# lens re-admitted later must not inherit that default in silence.
lenses:
  cleanliness:
    enabled: false
    family: opencode
    model: opencode/muse-spark-1.3-contributor-free
    effort: high
    budget_usd: 5.0
    max_turns: 40
    timeout_s: 900
  efficiency:
    enabled: false
    family: opencode
    model: opencode/muse-spark-1.3-contributor-free
    effort: high
    budget_usd: 5.0
    max_turns: 40
    timeout_s: 900
  design:
    family: opencode
    model: opencode/muse-spark-1.3-contributor-free
    effort: high
    budget_usd: 5.0
    max_turns: 60
    timeout_s: 1800
  gating:
    family: opencode
    model: opencode/muse-spark-1.3-contributor-free
    effort: high
    budget_usd: 5.0
    max_turns: 60
    timeout_s: 1800
    forbid_families: [codex]
  implementation:
    family: opencode
    model: opencode/muse-spark-1.3-contributor-free
    effort: high
    budget_usd: 8.0
    max_turns: 120
    timeout_s: 2700

roles:
  verifier:
    budget_usd: 5.0
    max_turns: 40
    timeout_s: 900
    models:
      gemini: gemini-3.7-flash-medium
      opencode: opencode/muse-spark-1.3-contributor-free
  claims:
    family: opencode
    model: opencode/muse-spark-1.3-contributor-free
    effort: high
    budget_usd: 3.0
    max_turns: 30
    timeout_s: 900

# Every lens runs on opencode, so there is nothing to reroute and nothing to disagree
# with: the verifier's gemini entry is the opposite family verify.opposite() picks, and
# it produces no second reading of its own. Both are stated rather than omitted.
routing:
  opposite: {}
  reroute_lenses: []

dual_family:
  lenses: []
  enabled: false

bounds:
  max_verifier_sessions: 20
  max_proven_suggestions: 10
  max_wall_s: 5400
  attempts_per_task: 2

sandbox:
  tier: userns
  image: null
