# Commit this seed before admission. Use the patched, pinned source engine.
goal: "<build intent; the operator admits the explicit phase tasks>"
cli: codex
max_agents: 4

# These native roles avoid the catalog personas of backend/reviewer. Distinct
# roles within a phase prevent same-role batching. Role policy survives retries;
# the driver also sends the resolved cli/model/effort on every task POST.
# Codex effort is enforced by model_reasoning_effort in ~/.codex/config.toml.
role_model_policy:
  resolver: {cli: codex, model: gpt-5.6-sol, effort: high}
  ci-fixer: {cli: codex, model: gpt-5.6-sol, effort: high}
  analyst: {cli: claude, model: claude-opus-5, effort: high}

# Native retries remain enabled. Unbriefed gate-repair/test-followup/evolution
# tasks are not admitted by this workflow's closed phase inventory.
evolution_enabled: false
gate_repair_enabled: false
orchestration:
  test_followup: false

quality_gates:
  enabled: true
  cache_enabled: false
  flaky_detection: false
  pipeline:
    - {name: scorer, required: true, condition: always}
    - {name: run_config, required: true, condition: always}
  base_ref: <type>/<slug>
  cross_model: {enabled: false}
  intent_verification: {enabled: false}

# The driver writes merge_strategy: direct into runtime/run_config.json; it is
# not a seed key. Judges run between native runs through Claude ACP, outside
# this gate pipeline. The installed scorer always checks ordinary fixes too.
# BERNSTEIN_RESPONSE_CACHE=0 is enforced by the mandatory engine patch; the
# quality-gate cache switch above does not disable semantic response reuse.
# Warm slots have no persistent worker; empty-path slots fall back to a fresh
# worktree in the pinned engine. The scorer still refuses the workspace root.
# Preserve scope buckets: small 15m, medium 30m, large 60m, large+high 120m.
# Runtime tuning requires the source fixes that read current defaults.
tuning:
  orchestrator:
    # DEFAULT 900 (core/defaults.py:117) released a healthy Codex agent at 16 min with all
    # 14 files written and uncommitted. The canonical eval step is 1500 s and a step that
    # also writes tests and reruns a suite is a multiple of that, so the default cannot fit
    # the workload it was bought for. 5400 = Bernstein's own wall-clock hard cap, so the
    # stale-claim release can never fire before the reaper that carries a real reason.
    stale_claim_timeout_s: 5400
    # Must stay strictly ABOVE stale_claim_timeout_s (the reasoning at
    # core/defaults.py:129-136 is why 1800 sits above the default 900); raising one without
    # the other lets the run declare itself stalled before the claim is ever released.
    stalled_run_grace_s: 7200
    # The initial wall-clock kill deadline (core/defaults.py:168, default 1800). It
    # self-extends +600 s/tick only WHILE THE AGENT HEARTBEATS, and Codex spawns
    # `consumes_heartbeat_dir=False`, so for a codex step this value is the whole budget.
    # 1800 = the shipped default. RAISING this floors EVERY deadline at the raised
    # value (task_lifecycle takes max(bucket, this) once it exceeds 1800), which made
    # the scope buckets inert for a whole run (measured 2026-09-03: every step got a
    # 90-min kill deadline). At the default, buckets rule (small 15m / medium 30m /
    # large 60m / xl 120m) and a session past its bucket with a FRESH heartbeat is
    # auto-extended +600s up to the 5400 hard cap -- healthy agents are not killed.
    max_agent_runtime_s: 1800
    stalled_manager_threshold_s: 900
  agent:
    # Codex writes no heartbeat, so liveness rests on the runner log's mtime. DEFAULT 90
    # did not suppress at `log_age_s=141.7` and `escalation_sigterm_s` (default 120) SIGTERMed
    # a healthy agent 318 s in. Ten minutes of log silence is a normal long model turn.
    liveness_grace_s: 600
    # How long that grace may keep deferring (default 900). Above the starting timeout,
    # below the 5400 s wall-clock cap, so a genuinely stalled agent still stops.
    liveness_suppression_cap_s: 3600
    # First-turn window (default 300): a cold codex step with a large brief exceeds it.
    heartbeat_starting_timeout_s: 900
    # The escalation ladder is seconds of HEARTBEAT silence, and a no-heartbeat adapter is
    # silent by construction; only the liveness grace above stands between it and these.
    # Keep the order warn < sigusr1 < sigterm < sigkill and every tier above the grace.
    escalation_warn_s: 600
    escalation_sigusr1_s: 900
    escalation_sigterm_s: 1200
    escalation_sigkill_s: 1500


internal_llm_provider: none
