# Sidecar for build.yaml: per-step build-workflow options keyed by step title. Bernstein
# never reads this file; `bernstein-herdr gate` and readiness do.
#
# The executor is chosen by the step's `role:` in the plan plus `role_model_policy` in
# bernstein.yaml, NOT here. From the 2026-08-31 evals (Codex 18 certain defects over seven
# cases, Opus 5 two): give seam and interface steps -- a contract, a schema, anything a
# later phase builds against, and every judge step -- a role that resolves to claude
# (`analyst`, `adversary`); give bulk steps inside one already-decided package a role that
# resolves to codex (`resolver`).
defaults:
  # The integration branch, not a sha: a step's diff, its allowlist check and its archive
  # are all `git diff <base>`, and after an earlier step merges, a fixed sha shows that
  # step's files as this one's changes (measured: a scorer blocked on a sibling's file).
  # The JUDGE is the exception -- it needs the sha frozen at run start, which
  # `bernstein-herdr run-config` writes to <run>/bernstein.json and to the git ref
  # refs/build/base/<slug>. See judge-brief.md.
  base: <integration branch>
  # The default gate command. ANY step may override it with its own `gate_cmd:` below.
  # Use the override whenever a later phase leaves a module red on purpose: with one
  # command for the whole plan, every earlier phase's gate is dragged down to the
  # intersection of what all of them can pass, and a step that is green in its own scope
  # blocks on a sibling's unfinished module (failure D, 2026-09-02).
  gate_cmd: just check
  judge: optional         # optional = judge-N step after merge; none = no judge

steps:
  # `brief:` starting with `.agents/` resolves against the REPO ROOT and must be tracked:
  # it is the file the step's plan `description:` tells the agent to read, and only tracked
  # files exist inside the agent's worktree. Anything else resolves against the run dir
  # (untracked, driver-side only).
  "phase-1a: <what>":
    brief: .agents/build/plans/<slug>/phase-1a.md
    report: .agents/phase-1a.md
    judge: optional
  "phase-1b: <what else>":
    brief: .agents/build/plans/<slug>/phase-1b.md
    report: .agents/phase-1b.md
    judge: optional
    # Scoped to this step's own package, because the rest of the tree is still red until
    # phase-2 lands. Readiness prints the command each step will run.
    gate_cmd: just check-<this step's package>
  "judge-1: blind review of phase-1":
    brief: .agents/build/plans/<slug>/judge-1.md
    report: .agents/blind-review.md   # MUST be exactly this: the verdict parser reads
                                      # <worktree>/.agents/blind-review.md and nothing else
    judges: "phase-1a: <what>"  # presence of `judges` marks this a judge step: the gate
                                # parses its verdict instead of running the scorer. It names
                                # the phase under review; the brief points the judge at every
                                # sibling report.
  "phase-2: <what>":
    brief: .agents/build/plans/<slug>/phase-2.md
    report: .agents/phase-2.md
  # fix-1 always runs: the judge's verdict routes and does not block, so this step exists
  # whatever the review said and completes as a no-op (a report commit and nothing else)
  # when the review declares `Certain: 0`. See fix-brief.md.
  "fix-1: judge findings on phase-1":
    brief: .agents/build/plans/<slug>/fix-1.md
    report: .agents/fix-1.md
  "polish-1: cleanliness and docs on phase-1 files":
    brief: .agents/build/plans/<slug>/polish-1.md
    report: .agents/polish-1.md
