# All paths are relative to the workspace root. No mutable "latest" evidence.
# Judge briefs are tracked input; their outputs remain outside the integration tree.
defaults:
  doc: <plan dir>/plan.md
  spec: <plan dir>/spec.md
  # design: <optional product spec path>
  signoff: <spec sign-off commit sha>
  gate_cmd: <exact whole-tree command>
# Derive these from the plan and measured medians, never copy arbitrary budgets.
# Attempts include every native phase/fix run and every detached judge ceremony.
bounds:
  max_attempts: <positive integer including bounded repair allowance>
  max_wall_s: <whole-build wall budget including downtime>
  max_spend_usd: <whole-build dollar budget>
  run_budget_usd: <reservation per native run>
phases:
  - name: implementation
    steps: ["implement: <behavior>"]
    fix: "fix-implement: repair verified findings"
    judge:
      brief: .agents/build/plans/<slug>/judge-implementation.md
      # transport: claude (default) binds budget, model and turns through the
      # Claude session bridge and requires measured USD cost. transport: acp runs
      # any other ACP agent, asking acpx for the model, turns and tool set, e.g.
      # adapter_argv: [<antigravity acp server>]; an agent that reports no cost is
      # unmetered and settles at its whole reservation. Every judge needs
      # max_turns, timeout_s and budget_usd whatever its transport.
      adapter_argv: [npx, --yes, "@agentclientprotocol/claude-agent-acp@0.60.0"]
      model: claude-opus-5
      max_turns: <positive integer>
      timeout_s: <ceremony wall budget>
      budget_usd: <ceremony dollar reservation>
  - name: regression
    final_regression: true
    steps: ["regress: verify combined behavior"]
    fix: "fix-regress: repair combined behavior"
    judge:
      brief: .agents/build/plans/<slug>/judge-regression.md
      adapter_argv: [npx, --yes, "@agentclientprotocol/claude-agent-acp@0.60.0"]
      model: claude-opus-5
      max_turns: <positive integer>
      timeout_s: <ceremony wall budget>
      budget_usd: <ceremony dollar reservation>
steps:
  "implement: <behavior>":
    brief: .agents/build/plans/<slug>/implement.md
    report: .agents/implement.md
    gate_cmd: <compile plus lint plus owned witnesses plus preexisting green tests>
  "fix-implement: repair verified findings":
    brief: .agents/build/plans/<slug>/fix-implement.md
    report: <report path>
    gate_cmd: <same scoped validation as the implementation>
  "regress: verify combined behavior":
    brief: .agents/build/plans/<slug>/regress.md
    report: .agents/regress.md
  "fix-regress: repair combined behavior":
    brief: .agents/build/plans/<slug>/fix-regress.md
    report: .agents/fix-regress.md
