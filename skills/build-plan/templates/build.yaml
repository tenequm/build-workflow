# Bernstein plan template. Copy to .agents/build/plans/<slug>.yaml (tracked) with its
# sidecar <slug>.steps.yaml. Stages run in order unless depends_on says otherwise;
# steps in a stage run in parallel. Bernstein's plan schema is strict, so
# build-workflow options (brief, report, base, judges, gate_cmd) live in the sidecar.
#
# `name:` MUST equal the run-directory slug: the tool derives .agents/build/runs/<name>
# from it.
#
# ROLE, NOT cli. Bernstein spawns its own adapters and resolves cli/model/effort by role
# through `role_model_policy` in bernstein.yaml (measured: `resolution for role='resolver':
# match=exact`). A per-step `cli:` is not in Bernstein's plan schema; it won the first
# spawn and was LOST on the retry, so it is not a dispatch key and is omitted below.
# Readiness fails any role with no policy entry.
#
# The four roles -- `resolver` (codex), `analyst` (claude), `adversary` (the judge),
# `visionary` (the shadow) -- are the persona-free names of Bernstein's role enum. The
# obvious names (`backend`, `reviewer`) each drag a 10 KB irrelevant catalog persona onto
# the front of the prompt and there is no switch; see bernstein.yaml's comment and
# docs/2609-02-persona-prefix.md. Do not rename them back, and do not invent new ones:
# anything outside `KNOWN_ROLES` (planning/plan_schema.py:22-41) fails `plan validate`.
#
# ONE STEP PER STAGE, and the stage name IS the step name; `depends_on` carries the whole
# DAG. Nothing disables Bernstein's task batching: `OrchestratorConfig.max_tasks_per_agent`
# defaults to 2 (core/tasks/models.py:1635) and no seed key, `tuning:` section,
# run_config.json field or `bernstein run` flag ever sets it. Two batched tasks become ONE
# session with one spawn. Batching groups CONCURRENTLY OPEN tasks BY ROLE, so one step per
# stage is necessary and not sufficient: `_groups_can_merge` (tick_pipeline.py:113-127)
# refuses to merge tasks whose cli or model differ, so parallel siblings must be given
# DIFFERENT ROLES that resolve to different clis (`resolver` = codex, `analyst` = claude).
#
# `description:` IS THE PROMPT. It is the only field of a step that reaches the agent
# (plan_loader.py:457); the sidecar is invisible to Bernstein and the run directory is
# untracked and outside every worktree. So the description points at the step's TRACKED
# brief, which is committed at .agents/build/plans/<slug>/<step>.md and therefore present
# in the agent's worktree.
#
# No completion_signals here. Bernstein 3.19.0 validates them and then drops them when it
# posts the task to its task server, so they never run. Completion is the git-diff output
# mode: the agent commits on its branch and exits. The gate is
# `bernstein-herdr gate`, wired once in bernstein.yaml's quality_gates pipeline.
#
# Shape per phase:
#   phase-N   executor; the gate runs the scorer in its worktree and merges on pass. Split
#             into siblings phase-Na, phase-Nb with disjoint file ownership once one step
#             would own more than ~8 files; siblings must not share a file (readiness fails
#             an overlapping allowlist) and must not share a role.
#   judge-N   depends on EVERY phase-N sibling stage, role adversary; reviews the merged
#             diff. Mark it by giving the step a `judges:` entry in the sidecar -- that
#             field, not the title, is what selects the verdict gate over the scorer.
#   phase-N+1 depends on the phase-N sibling stages ONLY, so it starts while judge-N runs
#   fix-N     depends on judge-N; brief says: read <run>/judge/phase-N, fix certain defects
#   polish-N  depends on judge-N, optional: cleanliness and docs on phase-N's files only
name: <slug>
description: <one line>
cli: codex
max_agents: 4
# Reference files every worker on this plan reads. Bernstein stamps them onto each task's
# metadata and content-addresses each one as (path, order, sha256) into the run journal.
# TRACKED PATHS ONLY: resolution is against the worker's worktree at spawn, so an
# untracked path is recorded `{"reason_code": "missing"}` and reaches nobody (measured
# 2026-09-02). Readiness fails an entry that is not in the step base.
context_files:
  - docs/spec.md
constraints:
  - "docs/spec.md is driver-owned: never edit it. Ambiguity -> smallest faithful shape, recorded under Deviations."
  - "Commit on your branch. Never push. Never touch main."

stages:
  # phase-1a and phase-1b are siblings: no dependency between them, so they run in
  # parallel, they own disjoint files, and they carry different roles so batching cannot
  # fold them into one session.
  - name: phase-1a
    steps:
      - title: "phase-1a: <what>"
        role: resolver
        description: |
          Read .agents/build/plans/<slug>/phase-1a.md in this worktree and execute it
          fully; commit your work on your branch when done.
        files:
          - <allowlisted path or glob>

  - name: phase-1b
    steps:
      - title: "phase-1b: <what else>"
        role: analyst
        description: |
          Read .agents/build/plans/<slug>/phase-1b.md in this worktree and execute it
          fully; commit your work on your branch when done.
        files:
          - <a disjoint path or glob; no overlap with phase-1a>

  - name: judge-1
    depends_on: [phase-1a, phase-1b]
    steps:
      - title: "judge-1: blind review of phase-1"
        role: adversary
        description: |
          Read .agents/build/plans/<slug>/judge-1.md in this worktree and execute it
          fully; commit your work on your branch when done.
        files: []

  - name: phase-2
    depends_on: [phase-1a, phase-1b]
    steps:
      - title: "phase-2: <what>"
        role: resolver
        description: |
          Read .agents/build/plans/<slug>/phase-2.md in this worktree and execute it
          fully; commit your work on your branch when done.
        files: []

  - name: fix-1
    depends_on: [judge-1]
    steps:
      - title: "fix-1: judge findings on phase-1"
        role: resolver
        description: |
          Read .agents/build/plans/<slug>/fix-1.md in this worktree and execute it
          fully; commit your work on your branch when done.
        files:
          - <phase-1a and phase-1b allowlists together>

  - name: polish-1
    depends_on: [judge-1]
    steps:
      - title: "polish-1: cleanliness and docs on phase-1 files"
        role: resolver
        priority: 4
        description: |
          Read .agents/build/plans/<slug>/polish-1.md in this worktree and execute it
          fully; commit your work on your branch when done.
        files:
          - <phase-1a and phase-1b allowlists together>
