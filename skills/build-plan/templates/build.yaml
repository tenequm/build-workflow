# Authored inventory, not a command to pass to bernstein run. The skill driver
# compiles one phase at a time and POSTs full payloads to a fresh native server.
# Every task belongs to one sidecar phase OR one conditional fix mini-run.
# No judge task exists. Dependencies requiring verified/merged predecessors
# MUST cross phase boundaries: native DONE can release an in-phase dependent
# before its predecessor's gate/merge. Never rely on in-phase strict ordering.
# One task per stage; unique titles; distinct roles and disjoint files per phase.
# Keep title/description free of native L0 triggers (lint, format, rename X to Y).
# Scope buckets: small 15m, medium 30m, large 60m, large+high complexity 120m.
name: <slug>
description: <build intent>
cli: codex
max_agents: 4
context_files:
  - <plan dir>/plan.md
  - <plan dir>/spec.md
constraints:
  - "Read your tracked brief. Never edit the plan directory or bernstein.yaml."
  - "Commit on your agent branch. Never push or move the integration branch."
stages:
  - name: implement
    steps:
      - title: "implement: <behavior>"
        role: analyst
        scope: large
        description: "Execute .agents/build/plans/<slug>/implement.md and commit the result."
        files: [<owned source path or glob>]
        completion_signals:
          - {type: file_contains, value: "<owned path> :: <literal completion witness>"}
  - name: fix-implement
    depends_on: [implement]
    steps:
      - title: "fix-implement: repair verified findings"
        role: resolver
        scope: large
        description: "Execute .agents/build/plans/<slug>/fix-implement.md using the immutable review input in this task."
        files: [<implementation repair allowlist>]
        completion_signals:
          - {type: file_contains, value: "<report path> :: Validation:"}
  - name: regress
    depends_on: [implement]
    steps:
      - title: "regress: verify combined behavior"
        role: resolver
        scope: large
        description: "Execute .agents/build/plans/<slug>/regress.md and commit the validation report."
        files: [<regression test paths>]
        completion_signals:
          - {type: file_contains, value: ".agents/regress.md :: Validation:"}
  - name: fix-regress
    depends_on: [regress]
    steps:
      - title: "fix-regress: repair combined behavior"
        role: analyst
        scope: large
        description: "Execute .agents/build/plans/<slug>/fix-regress.md using the immutable review input in this task."
        files: [<cumulative repair allowlist agreed before admission>]
        completion_signals:
          - {type: file_contains, value: ".agents/fix-regress.md :: Validation:"}
