[project]
name = "bernstein-herdr"
version = "0.1.0"
description = "readiness, run config and the quality gate for Bernstein native runs"
requires-python = ">=3.12"
dependencies = ["bernstein", "pyyaml"]

[project.scripts]
bernstein-herdr = "bernstein_herdr.cli:main"

[project.entry-points."bernstein.adapters"]
fake = "bernstein_herdr.fake:FakeAdapter"

[project.entry-points."bernstein.gates"]
scorer = "bernstein_herdr.gates.scorer:ScorerGate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
