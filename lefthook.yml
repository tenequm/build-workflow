pre-commit:
  commands:
    gitleaks:
      run: gitleaks protect --staged --redact -v
    plugin-manifest-sync:
      run: test "$(jq -r '.name,.version' plugin.json)" = "$(jq -r '.name,.version' .claude-plugin/plugin.json)" || (echo "plugin.json and .claude-plugin/plugin.json disagree on name/version" >&2; exit 1)
    template-validation-fence:
      glob: "skills/build-plan/templates/*.md"
      run: sh skills/build-plan/scripts/plan-lint.sh --templates
    shellcheck:
      glob: "*.sh"
      run: shellcheck {staged_files}
    kb-index:
      glob: "{docs/knowledge/*,docs/knowledge/**/*,scripts/kb_index.py}"
      run: python3 scripts/kb_index.py --check
    skill-isolation:
      glob: "{skills/**,scripts/skill_isolation.py}"
      run: python3 scripts/skill_isolation.py
    operator-python:
      glob: "{bernstein_operator/**,skills/build-run/scripts/**,skills/build-plan/scripts/**,skills/build-close/scripts/**,skills/review-pr/scripts/**,fixtures/review-pr/**}"
      run: just --justfile bernstein_operator/Justfile check
