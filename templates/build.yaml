# Bernstein plan template. Copy to .agents/build/plans/<slug>.yaml.
# Stages run in order unless depends_on says otherwise; steps in a stage run in parallel.
# Per step: cli pins the executor (herdr-claude | herdr-codex | herdr-agy), files is the allowlist
# (Bernstein turns it into ownership conflict detection), completion_signals is the scorer.
name: <slug>
description: <one line>
cli: herdr-claude
max_agents: 4
context_files:
  - docs/spec.md
constraints:
  - "docs/spec.md is driver-owned: never edit it. Ambiguity -> smallest faithful shape, recorded under Deviations."
  - "Commit on your branch. Never push. Never touch main."

stages:
  - name: phase-1
    steps:
      - title: "phase-1: <what>"
        role: backend
        cli: herdr-claude
        model: claude-opus-5
        effort: high
        files:
          - <allowlisted path or glob>
        context_files:
          - .agents/briefs/phase-1.md
        completion_signals:
          - type: test_passes
            command: "bernstein-herdr scorer --step phase-1"

  - name: judge-1
    depends_on: [phase-1]
    steps:
      - title: "judge-1: blind review of phase-1"
        role: reviewer
        cli: herdr-claude
        model: claude-opus-5
        completion_signals:
          - type: test_passes
            command: "bernstein-herdr blind-judge --step phase-1"

  # phase-2 depends on phase-1 only: it starts while judge-1 runs (speculation behind the gate).
  - name: phase-2
    depends_on: [phase-1]
    steps:
      - title: "phase-2: <what>"
        role: backend
        cli: herdr-codex
        files: []
        completion_signals:
          - type: test_passes
            command: "bernstein-herdr scorer --step phase-2"
