defaults:
  doc: docs/plans/2609-10-slugify/plan.md
  spec: docs/plans/2609-10-slugify/spec.md
  signoff: <SIGNOFF>
  gate_cmd: python3 -m unittest discover -s tests -q
bounds:
  max_attempts: 8
  max_wall_s: 5400
  max_spend_usd: 60
  run_budget_usd: 10
phases:
- name: implementation
  final_regression: true
  steps:
  - 'implement: slugify'
  fix: 'fix-implement: repair verified findings'
  judge:
    brief: .agents/build/plans/slugify/judge-implementation.md
    transport: claude
    adapter_argv:
    - npx
    - --yes
    - '@agentclientprotocol/claude-agent-acp@0.60.0'
    model: claude-sonnet-5
    max_turns: 40
    timeout_s: 900
    budget_usd: 3
steps:
  'implement: slugify':
    brief: .agents/build/plans/slugify/implement.md
    report: reports/implement.md
  'fix-implement: repair verified findings':
    brief: .agents/build/plans/slugify/fix-implement.md
    report: reports/fix-implement.md
